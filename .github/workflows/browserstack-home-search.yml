name: BrowserStack Home and Search Tests

on:
  workflow_dispatch:
    inputs:
      device_name:
        description: BrowserStack Android device name
        required: true
        default: Google Pixel 8
        type: string
      os_version:
        description: Android OS version
        required: true
        default: "14.0"
        type: string

permissions:
  contents: read

jobs:
  home-search-real-device:
    name: Home and search on BrowserStack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Parse and verify BrowserStack credentials
        env:
          ROHANSAHA_NGXOSY: ${{ secrets.ROHANSAHA_NGXOSY }}
        run: |
          set -euo pipefail
          BROWSERSTACK_USERNAME="$(printf '%s\n' "$ROHANSAHA_NGXOSY" | sed -n '1p' | tr -d '\r')"
          BROWSERSTACK_ACCESS_KEY="$(printf '%s\n' "$ROHANSAHA_NGXOSY" | sed -n '2p' | tr -d '\r')"
          EXTRA_LINE="$(printf '%s\n' "$ROHANSAHA_NGXOSY" | sed -n '3p' | tr -d '\r')"
          if [ -z "$BROWSERSTACK_USERNAME" ] || [ -z "$BROWSERSTACK_ACCESS_KEY" ] || [ -n "$EXTRA_LINE" ]; then
            echo "ROHANSAHA_NGXOSY must contain exactly two non-empty lines: username, then access key."
            exit 1
          fi
          echo "::add-mask::$BROWSERSTACK_USERNAME"
          echo "::add-mask::$BROWSERSTACK_ACCESS_KEY"
          {
            printf 'BROWSERSTACK_USERNAME=%s\n' "$BROWSERSTACK_USERNAME"
            printf 'BROWSERSTACK_ACCESS_KEY=%s\n' "$BROWSERSTACK_ACCESS_KEY"
          } >> "$GITHUB_ENV"

      - name: Build universal debug App Bundle
        run: ./gradlew --no-daemon :app:bundleDebug

      - name: Upload Nova to BrowserStack App Automate
        id: upload
        env:
          BROWSERSTACK_USERNAME: ${{ env.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ env.BROWSERSTACK_ACCESS_KEY }}
        run: |
          set -euo pipefail
          APP_FILE="app/build/outputs/bundle/debug/app-debug.aab"
          test -f "$APP_FILE"
          curl --fail-with-body --silent --show-error \
            -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@${APP_FILE}"             -o browserstack-upload.json
          APP_URL="$(jq -r '.app_url // empty' browserstack-upload.json)"
          if [ -z "$APP_URL" ]; then cat browserstack-upload.json; exit 1; fi
          echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"

      - name: Install Appium test dependency
        run: npm install --no-save webdriverio@9

      - name: Run home screen and search bar tests
        env:
          BROWSERSTACK_USERNAME: ${{ env.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ env.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_APP_URL: ${{ steps.upload.outputs.app_url }}
          BROWSERSTACK_DEVICE_NAME: ${{ inputs.device_name }}
          BROWSERSTACK_OS_VERSION: ${{ inputs.os_version }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: node browserstack-tests/home-search.mjs

      - name: Upload screenshots and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-browserstack-home-search-${{ github.run_number }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
