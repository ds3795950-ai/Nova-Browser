name: Nova remaining hardening batch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply guarded source fixes and regression tests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if new in s:
                  return
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected one patch anchor, found {n}: {old!r}")
              p.write_text(s.replace(old, new, 1))

          pv = "app/src/main/java/com/nova/browser/PasswordVault.kt"
          replace_once(pv,
              "val key = credentialKey(login.origin, login.username)",
              "val key = credentialKey(login.origin, login.username, login.formActionOrigin, login.httpRealm)")
          replace_once(pv,
              'metadata.put(credentialKey(origin, username), item.optLong("updatedAt"))',
              'metadata.put(credentialKey(origin, username, item.optString("formActionOrigin").ifBlank { null }, item.optString("httpRealm").ifBlank { null }), item.optLong("updatedAt"))')
          replace_once(pv,
              '(store.getKey(alias, null) as? SecretKey)?.let { return it }\n        val generator = KeyGenerator.getInstance',
              '(store.getKey(alias, null) as? SecretKey)?.let { return it }\n        if (vaultFile.exists() || prefs.contains(KEY_BLOB)) {\n            throw IllegalStateException("The saved password vault exists but its Android Keystore key is missing. Encrypted data was preserved.")\n        }\n        val generator = KeyGenerator.getInstance')

          cloud = "app/src/main/java/com/nova/browser/NovaCloudSync.kt"
          replace_once(cloud,
              'val encodedVersion = java.net.URLEncoder.encode(expectedVersion, "UTF-8")\n            request("PATCH", "/rest/v1/$table?user_id=eq.$userId&updated_at=eq.$encodedVersion"',
              'val encodedVersion = java.net.URLEncoder.encode(expectedVersion, "UTF-8")\n            val encodedUserId = java.net.URLEncoder.encode(userId, "UTF-8")\n            request("PATCH", "/rest/v1/$table?user_id=eq.$encodedUserId&updated_at=eq.$encodedVersion"')
          replace_once(cloud,
              '(store.getKey(KEY_ALIAS, null) as? SecretKey)?.let { return it }\n        val generator = KeyGenerator.getInstance',
              '(store.getKey(KEY_ALIAS, null) as? SecretKey)?.let { return it }\n        if (sessionFile.exists()) {\n            throw IllegalStateException("Saved cloud session cannot be decrypted because its Android Keystore key is missing. Sign in again to create a new session.")\n        }\n        val generator = KeyGenerator.getInstance')

          snap = "app/src/main/java/com/nova/browser/NovaSyncSnapshotRepository.kt"
          replace_once(snap,
              '        editor.apply()\n    }',
              '        check(editor.commit()) { "Could not persist the restored Nova sync snapshot" }\n    }')

          test = Path("app/src/test/java/com/nova/browser/PasswordVaultSyncMergeTest.kt")
          if not test.exists():
              test.write_text("""package com.nova.browser

import org.json.JSONArray
import org.json.JSONObject
import org.junit.Assert.assertEquals
import org.junit.Test

class PasswordVaultSyncMergeTest {
    private fun credential(realm: String, updatedAt: Long = 10L) =
        JSONObject().put("origin", "https://example.com")
            .put("username", "alice").put("httpRealm", realm)
            .put("password", "secret-$realm").put("updatedAt", updatedAt)

    @Test fun sameUsernameInDifferentRealmsRemainsDistinct() {
        val merged = PasswordVault.mergeSyncBundles(
            JSONObject().put("credentials", JSONArray().put(credential("admin"))),
            JSONObject().put("credentials", JSONArray().put(credential("member")))
        )
        assertEquals(2, merged.getJSONArray("credentials").length())
    }

    @Test fun deletionMarkerIsScopedToCredentialRealm() {
        val deleted = JSONObject().put(
            "https://example.com|alice||admin", 20L
        )
        val merged = PasswordVault.mergeSyncBundles(
            JSONObject().put("credentials", JSONArray().put(credential("admin", 10L)).put(credential("member", 10L))),
            JSONObject().put("credentials", JSONArray()).put("deleted", deleted)
        )
        assertEquals(1, merged.getJSONArray("credentials").length())
        assertEquals("member", merged.getJSONArray("credentials").getJSONObject(0).getString("httpRealm"))
    }
}
""")
          PY
      - name: Run unit tests and assemble debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Commit verified hardening batch
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/nova/browser/PasswordVault.kt app/src/main/java/com/nova/browser/NovaCloudSync.kt app/src/main/java/com/nova/browser/NovaSyncSnapshotRepository.kt app/src/test/java/com/nova/browser/PasswordVaultSyncMergeTest.kt
            git commit -m "Harden vault and cloud sync recovery"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
