name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Generate Gradle dependency verification metadata
        run: gradle --write-verification-metadata sha256 :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - name: Commit generated dependency verification metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          if ! git diff --cached --quiet; then
            git commit -m "Add Gradle dependency verification metadata"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload dependency verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: gradle-verification-metadata
          path: gradle/verification-metadata.xml
          retention-days: 2
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest
      - name: Assemble debug APK
        run: gradle :app:assembleDebug
      - name: Decode release keystore when all signing secrets are configured
        env:
          KEYSTORE_BASE64: ${{ secrets.NOVA_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NOVA_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOVA_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NOVA_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nova-release.jks"
            echo "NOVA_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/nova-release.jks" >> "$GITHUB_ENV"
            echo "Release signing is configured."
          else
            echo "Release signing secrets are incomplete; CI will build an unsigned APK."
          fi
      - name: Assemble release APK (signed when release secrets are configured)
        env:
          NOVA_RELEASE_STORE_PASSWORD: ${{ secrets.NOVA_RELEASE_STORE_PASSWORD }}
          NOVA_RELEASE_KEY_ALIAS: ${{ secrets.NOVA_RELEASE_KEY_ALIAS }}
          NOVA_RELEASE_KEY_PASSWORD: ${{ secrets.NOVA_RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease
      - name: Upload APK artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nova-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 2
