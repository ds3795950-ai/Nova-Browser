name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Android SDK 37.2 platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37.2"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest
      - name: Assemble debug APK
        run: gradle :app:assembleDebug
      - name: Decode release keystore when all signing secrets are configured
        # Never expose signing secrets to pull-request code.
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.NOVA_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NOVA_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOVA_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NOVA_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nova-release.jks"
            echo "NOVA_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/nova-release.jks" >> "$GITHUB_ENV"
            echo "Release signing is configured."
          else
            echo "Release signing secrets are incomplete; CI will build an unsigned APK."
          fi
      - name: Assemble release APK (signed when release secrets are configured)
        env:
          NOVA_RELEASE_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.NOVA_RELEASE_STORE_PASSWORD || '' }}
          NOVA_RELEASE_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.NOVA_RELEASE_KEY_ALIAS || '' }}
          NOVA_RELEASE_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.NOVA_RELEASE_KEY_PASSWORD || '' }}
        run: gradle :app:assembleRelease
      - name: Upload APK artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nova-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
