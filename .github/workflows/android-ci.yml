name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Android SDK 37.2 platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37.2"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest
      - name: Assemble debug APK
        run: gradle :app:assembleDebug
      - name: Decode release keystore when all signing secrets are configured
        # Never expose signing secrets to pull-request code.
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.NOVA_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NOVA_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOVA_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NOVA_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nova-release.jks"
            echo "NOVA_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/nova-release.jks" >> "$GITHUB_ENV"
            echo "Release signing is configured."
          else
            echo "Release signing secrets are incomplete; CI will build an unsigned APK."
          fi
      - name: Assemble release APK (signed when release secrets are configured)
        env:
          NOVA_RELEASE_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.NOVA_RELEASE_STORE_PASSWORD || '' }}
          NOVA_RELEASE_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.NOVA_RELEASE_KEY_ALIAS || '' }}
          NOVA_RELEASE_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.NOVA_RELEASE_KEY_PASSWORD || '' }}
        run: gradle :app:assembleRelease
      - name: Stage installable ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          SIGNED_APK="app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          UNSIGNED_APK="app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk"
          if [ -f "$SIGNED_APK" ]; then
            cp "$SIGNED_APK" artifacts/NovaBrowser-arm64-release.apk
            echo "Using the production-signed ARM64 release APK."
          elif [ -f "$UNSIGNED_APK" ] && [ -f "$HOME/.android/debug.keystore" ]; then
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            test -n "$APKSIGNER"
            "$APKSIGNER" sign --ks "$HOME/.android/debug.keystore" \
              --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android \
              --out artifacts/NovaBrowser-arm64-test.apk "$UNSIGNED_APK"
            "$APKSIGNER" verify --verbose artifacts/NovaBrowser-arm64-test.apk
            echo "No production signing key is configured; this optimized ARM64 APK is signed with the runner's temporary debug key for testing only."
          else
            cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk artifacts/NovaBrowser-arm64-debug.apk
            echo "Using the installable ARM64 debug APK fallback."
          fi
          ls -lh artifacts
          sha256sum artifacts/*.apk
      - name: Upload ARM64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-arm64-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 7
