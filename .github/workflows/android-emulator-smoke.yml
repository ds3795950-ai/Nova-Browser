name: Android Emulator Smoke

on:
  push:
    branches: [main, feature/phase-1-dual-engine-foundation, fix/phase-1-engine-compatibility, feature/phase-2-privacy-isolation]
  pull_request:
    branches: [main, fix/phase-1-engine-compatibility]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Public-repo hosted Linux runners expose /dev/kvm; without this rule the emulator cannot use it.
      # Software (TCG) emulation of Android 16 never finished booting, so the job hung until timeout.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Install Android SDK 37.2 platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37.2" "platforms;android-36"
      - name: Run Android 16 emulator smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096
          heap-size: 512
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          emulator-boot-timeout: 900
          # Keep animations enabled: post-boot animation toggles can lose ADB here.
          disable-animations: false
          script: >-
            set +e; if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then gradle :app:connectedDebugAndroidTest --stacktrace; else gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.nova.browser.CefriumEmulatorSmokeTest --stacktrace; fi; TEST_STATUS=$?; mkdir -p android16-test-diagnostics; adb devices -l > android16-test-diagnostics/adb-devices.txt 2>&1 || true; adb logcat -d -t 5000 > android16-test-diagnostics/logcat.txt 2>&1 || true; exit "$TEST_STATUS"
      - name: Upload Android 16 test reports and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-android16-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/connected/debug/**
            app/build/outputs/androidTest-results/connected/debug/**
            android16-test-diagnostics/**
          if-no-files-found: warn
          retention-days: 7
