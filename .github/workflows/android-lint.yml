name: Android Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 37 extension 1
        run: sdkmanager "platforms;android-37-ext1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Run Android lint (bounded)
        run: timeout 8m gradle :app:lintDebug --no-daemon --continue
      - name: Upload lint reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nova-android-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 7
