name: Android Emulator UI Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'browserstack-tests/**'
      - '.github/workflows/android-emulator-ui.yml'

permissions:
  contents: read

concurrency:
  group: nova-emulator-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-ui:
    name: Home, search, privacy and settings on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Appium and WebdriverIO
        run: |
          npm install --no-save --package-lock=false webdriverio@9.33.1 appium@2.19.0
          npx appium driver install --source=npm appium-uiautomator2-driver@4.2.9

      - name: Run UI regression on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            mkdir -p test-results
            trap 'mkdir -p test-results; cp /tmp/nova-appium.log test-results/appium.log 2>/dev/null || true' EXIT
            gradle --no-daemon :app:assembleDebug
            APP_FILE=app/build/outputs/apk/debug/app-debug.apk
            test -s "$APP_FILE"
            adb install -r "$APP_FILE"
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            nohup npx appium --base-path /wd/hub --log-level warn > /tmp/nova-appium.log 2>&1 &
            for attempt in $(seq 1 60); do
              if curl --silent --fail http://127.0.0.1:4723/wd/hub/status >/dev/null; then break; fi
              sleep 2
            done
            curl --silent --fail http://127.0.0.1:4723/wd/hub/status >/dev/null
            APPIUM_SERVER_URL=http://127.0.0.1:4723/wd/hub \
            NOVA_APP_PATH="$PWD/$APP_FILE" \
            ANDROID_DEVICE_NAME=emulator-5554 \
            GITHUB_RUN_NUMBER="$GITHUB_RUN_NUMBER" \
              node browserstack-tests/home-search.mjs

      - name: Upload emulator UI screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-android-emulator-ui-${{ github.run_number }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
