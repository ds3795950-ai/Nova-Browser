name: Clean up old GitHub Actions artifacts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts older than two days
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 2 * 24 * 60 * 60 * 1000;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const stale = artifacts.filter(item => Date.parse(item.created_at) < cutoff);
            let reclaimed = 0;
            for (const artifact of stale) {
              await github.rest.actions.deleteArtifact({ owner: context.repo.owner, repo: context.repo.repo, artifact_id: artifact.id });
              reclaimed += artifact.size_in_bytes || 0;
            }
            core.info(`Deleted ${stale.length} stale artifacts; reclaimed approximately ${(reclaimed / 1e9).toFixed(2)} GB.`);
